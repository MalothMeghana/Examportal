steps:
  # ------------------------------------
  # 1) Build Backend Docker Image
  # ------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    dir: 'server'
    args:
      [
        "build",
        "-t",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-backend:latest",
        "-f",
        "Dockerfile",
        "."
      ]

  # ------------------------------------
  # 2) Push Image to Artifact Registry
  # ------------------------------------
  - name: "gcr.io/cloud-builders/docker"
    dir: 'server'
    args:
      [
        "push",
        "asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-backend:latest"
      ]

  # ------------------------------------
  # 3) Deploy Backend to Cloud Run
  # ------------------------------------
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      [
        "run",
        "deploy",
        "exam-backend",
        "--image=asia-south1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/exam-backend:latest",
        "--region=asia-south1",
        "--platform=managed",
        "--allow-unauthenticated"
      ]

timeout: "1200s"

options:
  logging: CLOUD_LOGGING_ONLY

